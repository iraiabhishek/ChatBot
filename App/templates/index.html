<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}?v=1.4">
</head>
<body>

    <header>
        <span>Chatbot</span>
        <div class="header-buttons">
            <button id="newChatBtn" onclick="clearChat()">New Chat</button>
            <button id="themeToggleBtn" onclick="toggleTheme()">🌙</button>
        </div>
    </header>




    <div class="chat-container">
        <div class="chatbox" id="chatbox"></div>
        <div class="input-container">
            <input type="text" id="userInput" placeholder="Type your message..." autofocus>
            <button id="sendButton" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <footer>
        Design and developed by <b>Abhishek Rai</b>
    </footer>

    <script src="{{ url_for('static', filename='script.js') }}?v=1.4"></script>

</body>
</html>
